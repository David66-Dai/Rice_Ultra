# 数智稻安统一配置。复制为 config.yaml 后填写本机值；实际配置不要提交。
# RICE_CONFIG_PATH 可指定另一份 YAML。修改后重启对应服务。
# Spring 原生键直接绑定 Java；Python 只读取首文档 app.inference。
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1
      username: ""
      password: ""
      connect-timeout: 1s
      timeout: 2s
      repositories:
        enabled: false
  profiles:
    default: mysql
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8185

web:
  # 仅由 Vite 开发服务器读取，不会发送给浏览器。
  dev-host: "0.0.0.0"
  dev-port: 5173
  api-host: "127.0.0.1"

app:
  devices:
    # 仅列出的登录用户名可控制设备；空列表默认禁止所有人（包括 ADMIN）。
    # 例如 ["operator1", "operator2"]；修改后重启后端。
    # 机器人映射到的服务账号也必须写进来才能控制设备，角色本身不授予权限。
    control-users: []
  astrbot-control:
    # AstrBot 使用独立的受限集成令牌，只能访问下面两个设备接口；至少 32 个字符。
    enabled: false
    api-token: ""
    # 测试命令只跳过聊天端二次确认，仍校验身份映射、账号、设备白名单和状态版本。
    allow-test-control: false
    confirmation-ttl: "2m"
    # AstrBot 未指定喷药时长时默认 60 秒；显式时长仍受 max-duration-seconds 限制。
    default-spray-duration-seconds: 60
    max-duration-seconds: 300
    # AstrBot 农业查询单次日期范围限制。
    max-query-range-days: 31
    # 同时精确匹配会话 UMO 和发送者 ID，再映射到已有平台登录用户名。
    # 个人微信、OneBot v11/NapCat 和 QQ 官方适配器共用此列表；在各目标会话执行 /sid 复制真实值。
    # 机器人建议映射到 create-user.cmd -NoLogin 创建的服务账号（enabled=1、login_enabled=0）。
    identities: []
    # identities:
    #   - umo: "从 /agri_control_status 复制"
    #     sender-id: "从 /agri_control_status 复制"
    #     username: "admin"
    #   - umo: "qq_<botid>:FriendMessage:<会话ID>"
    #     sender-id: "<发送者ID>"
    #     username: "astrbot"
  prevention-control:
    # 首次建库时该值决定“识别联动 AstrBot 消息确认”开关；之后以前端保存的数据库值为准。
    require-astrbot-confirmation-default: true
    # 喷药开启前必须有新鲜风速；人工喷药还必须有有效红色叶害识别。
    spray-safety-enabled: true
    max-spray-wind-speed-m-s: 3.0
    sensor-max-age: "2m"
    leaf-evidence-max-age: "24h"
    diagnosis-confirmation-ttl: "10m"
    # 主动消息告警沿用 AstrBot /api/v1/im/message；API Key 需要 im scope。
    # HTTP 仅允许回环地址，远程必须 HTTPS；alert-umos 可同时列出微信和 QQ 会话。
    # 每个会话的投递状态、重试和送达时间分别记录：一个平台失败不影响另一个平台收到告警，
    # 也只有确实收到该条告警的会话才能确认放行设备。
    astrbot-alert-enabled: false
    astrbot-base-url: "http://127.0.0.1:6185"
    astrbot-api-key: ""
    alert-umos: []
    # alert-umos:
    #   - "wx:FriendMessage:<微信会话ID>"
    #   - "qq_<botid>:FriendMessage:<QQ会话ID>"
  hdfs:
    # WebHDFS（NameNode HTTP 端口）；报告按 point_N/output_yyyyMMdd_HHmm.json 保存。
    web-url: "http://127.0.0.1:9870"
    user: ""
    base-path: "/rice/output"
    connect-timeout-seconds: 5
    timeout-seconds: 30
    data-node-host-overrides: {}
  dify:
    # 导入 docs/dify 中的新版工作流并发布后填写该应用的 API 密钥。
    base-url: "http://localhost/v1"
    api-key: ""
    connect-timeout-seconds: 5
    timeout-seconds: 180
  hive:
    # HiveServer2 连接信息；表名与字段映射由后端代码维护。
    url: "jdbc:hive2://127.0.0.1:10000/farm"
    username: ""
    password: ""
    query-timeout-seconds: 30
    socket-timeout-ms: 45000
  inference:
    host: "127.0.0.1"
    port: 8001
    reload: true
    # 部署在其他机器时可直接改成完整 URL。
    base-url: "http://${app.inference.host}:${app.inference.port}"
    cors:
      allowed-origins: ["*"]
  realtime:
    redis:
      enabled: false
      device-id: environment_platform_01
      freshness-seconds: 30
      retry-delay-ms: 1000
    serial:
      # 复制示例后按硬件情况开启；dev 模式强制在下文覆盖为 false。
      enabled: false
      # 采集器重新枚举时 COM 号会变，按顺序填写候选串口，逗号分隔；程序用第一个能打开的。
      port: "COM4,COM5"
      baud-rate: 9600
      station-id: "S01"
    weather:
      # 留空保留现有公网 IP 定位行为；填写后使用农田固定坐标。
      latitude: ""
      longitude: ""
  cors:
    allowed-origins: "http://localhost:${web.dev-port},http://127.0.0.1:${web.dev-port},http://localhost:8081"
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*,http://10.*:*,http://192.168.*:*,http://172.*:*"
  auth:
    jwt-secret: ""
    access-token-ttl: "2h"
    remember-me-ttl: "30d"
    max-failed-attempts: 5
    lock-duration: "15m"
    bootstrap-admin:
      # 仅用户表为空时创建账号，修改这里不会修改已有用户密码。
      enabled: false
      username: "admin"
      password: ""
      display-name: "系统管理员"

---
# 默认使用 MySQL；凭据可通过 SPRING_DATASOURCE_* 环境变量覆盖。
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/smart_rice_security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: ""
    password: ""
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  jpa:
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.MySQLDialect"

---
# 用 --spring.profiles.active=dev 或 SPRING_PROFILES_ACTIVE=dev 启用。
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: "jdbc:h2:mem:smart_rice_security;MODE=MySQL;DB_CLOSE_DELAY=-1"
    driver-class-name: "org.h2.Driver"
    username: "sa"
    password: ""
  jpa:
    show-sql: false
  h2:
    console:
      enabled: true
app:
  realtime:
    redis:
      enabled: false
    serial:
      enabled: false
