# MySQL profile: run with --spring.profiles.active=mysql
# 先执行 server/sql/init.sql 创建库 smart_rice_security 与登录表
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/smart_rice_security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 正式环境务必固定 JWT 密钥（>= 32 字节随机串），否则每次重启所有访问令牌失效
# app.auth.jwt-secret=请替换为至少32字节的随机字符串
