spring.application.name=smart-rice-security-server
server.port=8080

# Active profile: `mysql` uses 库 smart_rice_security；本地无 MySQL 时改成 `dev` 用内存 H2
spring.profiles.active=mysql

# Inference service (Python)
app.inference.base-url=http://127.0.0.1:8001

# 历史数据表为空时，从打包的清洗 CSV 幂等导入
app.history.seed.enabled=true
app.history.seed.resource=classpath:data/agri_history_cleaned.csv

# COM4 传感器串口：GBK 文本协议，9600/8N1
app.realtime.serial.enabled=true
app.realtime.serial.port=COM4
app.realtime.serial.baud-rate=9600
app.realtime.serial.station-id=S01
# 留空时按服务器公网 IP 定位；部署到固定农田后应填写真实经纬度
app.realtime.weather.latitude=
app.realtime.weather.longitude=

# CORS for React web / Expo / 局域网 IP 访问
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://10.*:*,http://192.168.*:*,http://172.*:*

# ---- 登录 / 鉴权 ----
# JWT 签名密钥（HS256，至少 32 字节）。留空 = 每次启动随机生成，仅适合本地开发；
# 正式环境请用环境变量 APP_AUTH_JWT_SECRET 注入一段随机长字符串。
app.auth.jwt-secret=
# 访问令牌有效期 / “记住密码”令牌有效期（使用时滑动续期）
app.auth.access-token-ttl=2h
app.auth.remember-me-ttl=30d
# 连续密码错误 N 次锁定账号 M 分钟
app.auth.max-failed-attempts=5
app.auth.lock-duration=15m

# 系统无注册功能：用户表为空时自动创建的初始管理员（首次登录后请立刻改掉）
# 注意：.properties 按 ISO-8859-1 读取，中文值必须写成 \uXXXX（下面是“系统管理员”）
app.auth.bootstrap-admin.enabled=true
app.auth.bootstrap-admin.username=admin
app.auth.bootstrap-admin.password=SmartRice@2026
app.auth.bootstrap-admin.display-name=\u7CFB\u7EDF\u7BA1\u7406\u5458
